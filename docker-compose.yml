# 服务器一键部署:cp .env.example .env 填好后 → docker compose up -d --build
services:
  app:
    build: .
    image: stock-learning:latest
    container_name: stock-learning
    ports:
      - "8090:8090"
    # 变量从同目录 .env 读取(compose 自动做 ${} 替换);密钥不入库
    environment:
      TZ: Asia/Shanghai
      AUTH_USER: ${AUTH_USER}
      AUTH_PASS: ${AUTH_PASS}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - ./data:/data # 账户/流水等全部状态,宿主机目录持久化
    restart: unless-stopped
    healthcheck: # /api/meta/status 免口令,专供探测
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8090/api/meta/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
